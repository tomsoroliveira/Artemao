# Verifica uma vez por mês se as automações do GitHub e as bibliotecas do projeto
# têm versão nova. Quando tiver, o GitHub abre um aviso (Pull request) na aba
# "Pull requests". Ler o aviso e clicar em "Merge" atualiza o projeto.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
  - package-ecosystem: "pip"
    directory: "/tools"
    schedule:
      interval: "monthly"
