name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Baixar os arquivos do repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar as bibliotecas (versões fixas)
        run: pip install -r tools/requirements.txt

      - name: Converter os escaneamentos em modelos 3D
        run: python tools/converter.py

      - name: Verificar a segurança e montar o site
        run: python tools/montar_site.py

      - name: Enviar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar no GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
